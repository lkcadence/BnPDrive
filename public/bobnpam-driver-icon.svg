<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="drvGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#drvGrad)"/>

  <!-- steering wheel outer ring -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#ffffff" stroke-width="7"/>

  <!-- spokes -->
  <path d="M64 64 L64 36" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <path d="M64 64 L40 80" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <path d="M64 64 L88 80" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- hub -->
  <circle cx="64" cy="64" r="11" fill="#ffffff"/>
  <circle cx="64" cy="64" r="11" fill="none" stroke="#EA580C" stroke-width="1"/>

  <!-- small "B" and "P" hint on the hub for Bob & Pam -->
  <text x="64" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#EA580C">BP</text>
</svg>
