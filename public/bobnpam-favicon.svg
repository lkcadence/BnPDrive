<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- badge background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>

  <!-- subtle road line -->
  <rect x="10" y="50" width="44" height="2.5" rx="1.25" fill="#ffffff" opacity="0.25"/>

  <!-- car shadow -->
  <ellipse cx="32" cy="49" rx="19" ry="2.5" fill="#0f172a" opacity="0.15"/>

  <!-- car body -->
  <path d="M12 39
           Q12 33 18 33
           L21 33
           L25 24
           Q26.5 21 30 21
           L36 21
           Q39.5 21 41 24
           L45 33
           L48 33
           Q52 33 52 39
           L52 40.5
           Q52 42.5 50 42.5
           L14 42.5
           Q12 42.5 12 40.5
           Z"
        fill="#ffffff"/>

  <!-- windows -->
  <path d="M27.5 32 L30.5 25.5 Q31 24.5 32 24.5 L34 24.5 Q35 24.5 35.5 25.5 L38.5 32 Z"
        fill="#1E3A5F"/>
  <line x1="32" y1="24.5" x2="32" y2="32" stroke="#ffffff" stroke-width="1.3"/>

  <!-- headlight / taillight accents -->
  <circle cx="49.5" cy="37.5" r="1.6" fill="#FDE68A"/>
  <circle cx="14.5" cy="37.5" r="1.6" fill="#F87171"/>

  <!-- wheels -->
  <circle cx="20" cy="43.5" r="5" fill="#1E293B"/>
  <circle cx="20" cy="43.5" r="1.9" fill="#E2E8F0"/>
  <circle cx="44" cy="43.5" r="5" fill="#1E293B"/>
  <circle cx="44" cy="43.5" r="1.9" fill="#E2E8F0"/>
</svg>
